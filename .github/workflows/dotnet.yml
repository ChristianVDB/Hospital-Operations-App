name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Hospital-Operations-App.csproj
      - name: Build
        run: dotnet build Hospital-Operations-App.csproj --no-restore --configuration Release
      - name: Test
        run: |
          # Run tests only if test projects exist
          tests=$(find . -name '*Tests.csproj' -print -quit)
          if [ -z "$tests" ]; then
            echo "No test projects found; skipping tests"
          else
            dotnet test --no-build --configuration Release --verbosity normal
          fi
      - name: Publish (artifact)
        if: github.ref == 'refs/heads/main'
        run: |
          dotnet publish -c Release -o out
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish
          path: out

# Adjust dotnet-version and main branch as needed for your project
